[project]
name = "triderm"
version = "0.1.0"
description = "TriDerm: expert-triplet evaluation and multimodal (vision + LLM-triplet SOE) wound representations for RDEB"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "torch>=2.5",
    "typer>=0.15",
    "tqdm>=4.66",
    "pydantic>=2.9",
    "openai>=1.99",
    "python-dotenv>=1.0",
    "sentence-transformers>=5.0",
    "transformers>=4.57",
    "accelerate>=1.0",
    "open-clip-torch>=3.2",
    "timm>=1.0",
    "torchvision>=0.20",
    "albumentations>=1.4,<2",
    "pillow>=10.0",
    "pytorch-metric-learning>=2.6",
]

[project.scripts]
triderm = "triderm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triderm"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:albumentations.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore:'pin_memory' argument:UserWarning",
]
